# External keep-alive for the free Render instance: pings the public site every 5 minutes
# so it never spins down (Render sleeps a free web service after 15 min without inbound traffic).
name: keep-alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keep-alive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping Red Alert Syria
        run: |
          URL="https://red-alert-syria.onrender.com"
          for i in 1 2 3 4 5 6; do
            if out=$(curl -fsS -m 60 "$URL/api/health?src=gh&t=$(date +%s)"); then
              echo "ok: $out"
              curl -fsS -m 30 -o /dev/null "$URL/ar/" || true
              exit 0
            fi
            echo "attempt $i failed, retrying..."; sleep 20
          done
          echo "site did not respond"; exit 1
