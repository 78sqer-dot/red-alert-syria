name: Web Push monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-push-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Measure synthetic Web Push fan-out
        run: npm run test:push-monitor

      - name: Probe live Web Push readiness and latency
        run: npm run monitor:web-push
        env:
          PUSH_MONITOR_BASE_URL: https://red-alert-syria.onrender.com
          PUSH_MONITOR_MAX_LATENCY_MS: '10000'
